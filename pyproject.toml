[project]
name = "lab-1-uv"
version = "0.1.0"
description = "Dataset generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=40.37.0",
]

[project.scripts]
dataset-users = "lab_1_uv.dataset_users:main"
dataset-orders = "lab_1_uv.dataset_orders:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
